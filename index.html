<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Import House | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style> body { font-family: sans-serif; background-color: #f3f4f6; } .hidden { display: none; } </style>
</head>
<body class="text-gray-900 pb-20">

    <div id="login-screen" class="h-screen flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
            <h1 class="text-2xl font-black mb-2">Admin Panel</h1>
            <p class="text-gray-500 mb-6">Login to manage store</p>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="email" id="email" placeholder="Admin Email" class="w-full p-3 border rounded-lg outline-none" required>
                <input type="password" id="password" placeholder="Password" class="w-full p-3 border rounded-lg outline-none" required>
                <button type="submit" class="w-full bg-black text-white font-bold py-3 rounded-lg">Login</button>
            </form>
        </div>
    </div>

    <div id="dashboard-screen" class="hidden min-h-screen">
        <header class="bg-black text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
            <h1 class="font-bold text-lg">Import House Admin</h1>
            <button onclick="logout()" class="text-xs bg-red-600 px-3 py-1 rounded">Logout</button>
        </header>

        <div class="flex p-4 gap-4 sticky top-16 bg-f3f4f6 z-40">
            <button onclick="switchTab('orders')" id="tab-orders" class="flex-1 py-3 bg-black text-white rounded-lg font-bold shadow-md transition">Orders</button>
            <button onclick="switchTab('products')" id="tab-products" class="flex-1 py-3 bg-white text-gray-500 rounded-lg font-bold shadow-sm transition">Add Stock</button>
        </div>

        <div id="view-orders">
            <div class="grid grid-cols-2 gap-4 px-4 mb-4">
                <div class="bg-white p-4 rounded-xl border border-gray-200"><p class="text-gray-500 text-xs uppercase font-bold">Total Orders</p><h2 class="text-3xl font-black" id="total-orders">0</h2></div>
                <div class="bg-white p-4 rounded-xl border border-gray-200"><p class="text-gray-500 text-xs uppercase font-bold">Revenue</p><h2 class="text-3xl font-black text-green-600" id="total-revenue">₹0</h2></div>
            </div>
            <div id="orders-list" class="px-4 space-y-4">
                <p class="text-center text-gray-400 mt-10">Loading orders...</p>
            </div>
        </div>

        <div id="view-products" class="hidden px-4">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-8">
                <h2 class="text-xl font-black mb-4">Add New Item</h2>
                <form onsubmit="addProduct(event)" class="space-y-4">
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase">Product Name</label>
                        <input id="prod-name" type="text" class="w-full p-3 border rounded-lg outline-none focus:border-black" required placeholder="e.g. Nike Air Max">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase">Brand</label>
                        <input id="prod-brand" type="text" class="w-full p-3 border rounded-lg outline-none focus:border-black" required placeholder="e.g. Nike">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase">Price (₹)</label>
                        <input id="prod-price" type="number" class="w-full p-3 border rounded-lg outline-none focus:border-black" required placeholder="4999">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase">Image Link</label>
                        <input id="prod-img" type="url" class="w-full p-3 border rounded-lg outline-none focus:border-black" required placeholder="https://...">
                        <p class="text-[10px] text-gray-400 mt-1">Tip: Right click any image on Google -> Copy Image Address</p>
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">Add Product</button>
                </form>
            </div>
            
            <h3 class="font-bold mb-4 px-2">Current Inventory</h3>
            <div id="products-list" class="space-y-3 pb-10"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, addDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // --- ⚠️ PASTE YOUR KEYS HERE ⚠️ ---
        const firebaseConfig = {
            apiKey: "AIzaSyAVAhzIDoiFiGxHN0z2ze9TSocB3Cbb6i8",
  authDomain: "shop-clothes-aded9.firebaseapp.com",
  projectId: "shop-clothes-aded9",
  storageBucket: "shop-clothes-aded9.firebasestorage.app",
  messagingSenderId: "119802803208",
  appId: "1:119802803208:web:984c947412580274268dbd",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- TABS LOGIC ---
        window.switchTab = (tab) => {
            const ordersBtn = document.getElementById('tab-orders');
            const prodsBtn = document.getElementById('tab-products');
            const ordersView = document.getElementById('view-orders');
            const prodsView = document.getElementById('view-products');

            if(tab === 'orders') {
                ordersBtn.className = "flex-1 py-3 bg-black text-white rounded-lg font-bold shadow-md";
                prodsBtn.className = "flex-1 py-3 bg-white text-gray-500 rounded-lg font-bold shadow-sm";
                ordersView.classList.remove('hidden');
                prodsView.classList.add('hidden');
            } else {
                prodsBtn.className = "flex-1 py-3 bg-black text-white rounded-lg font-bold shadow-md";
                ordersBtn.className = "flex-1 py-3 bg-white text-gray-500 rounded-lg font-bold shadow-sm";
                prodsView.classList.remove('hidden');
                ordersView.classList.add('hidden');
            }
        };

        // --- PRODUCT LOGIC ---
        window.addProduct = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Adding...";
            btn.disabled = true;
            
            try {
                await addDoc(collection(db, "products"), {
                    name: document.getElementById('prod-name').value,
                    brand: document.getElementById('prod-brand').value,
                    price: Number(document.getElementById('prod-price').value),
                    img: document.getElementById('prod-img').value,
                    timestamp: serverTimestamp()
                });
                alert("✅ Product Added Successfully!");
                e.target.reset();
            } catch (err) { alert("Error: " + err.message); }
            
            btn.innerText = originalText;
            btn.disabled = false;
        };

        window.deleteProduct = async (id) => {
            if(confirm("Are you sure you want to delete this product?")) {
                await deleteDoc(doc(db, "products", id));
            }
        };

        // --- AUTH & ORDERS LOGIC ---
        window.handleLogin = async (e) => {
            e.preventDefault();
            try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); } 
            catch (error) { alert("Login failed: " + error.message); }
        };

        window.logout = () => signOut(auth);
        window.updateStatus = async (id, status) => { await updateDoc(doc(db, "orders", id), { status: status }); };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                
                // 1. ORDERS LISTENER
                onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "desc")), (snapshot) => {
                    const list = document.getElementById('orders-list');
                    list.innerHTML = "";
                    let count = 0, revenue = 0;
                    
                    if(snapshot.empty) {
                        list.innerHTML = '<p class="text-center text-gray-400 mt-10">No orders yet.</p>';
                    } else {
                        snapshot.forEach((d) => {
                            const o = d.data();
                            count++; revenue += o.totalAmount;
                            
                            // Color Coding
                            let statusColor = "bg-yellow-100 text-yellow-800";
                            if(o.status === 'Shipped') statusColor = "bg-blue-100 text-blue-800";
                            if(o.status === 'Delivered') statusColor = "bg-green-100 text-green-800";

                            // Generate Items List
                            const itemsHTML = o.items.map(i => 
                                `<div class="flex justify-between text-sm text-gray-600 border-b border-dashed border-gray-200 py-1 last:border-0">
                                    <span>${i.name}</span><span>₹${i.price}</span>
                                 </div>`
                            ).join('');

                            list.innerHTML += `
                                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                                    <div class="flex justify-between items-center mb-3">
                                        <h3 class="font-bold text-lg">${o.customer.firstName}</h3>
                                        <span class="px-2 py-1 rounded text-xs font-bold ${statusColor}">${o.status}</span>
                                    </div>
                                    
                                    <div class="bg-gray-50 p-3 rounded-lg mb-3">
                                        ${itemsHTML}
                                        <div class="flex justify-between font-bold mt-2 pt-2 border-t border-gray-200">
                                            <span>Total</span><span>₹${o.totalAmount}</span>
                                        </div>
                                    </div>

                                    <div class="text-xs text-gray-500 mb-4">
                                        <p>📍 ${o.customer.address}, ${o.customer.city}</p>
                                        <p>📞 ${o.customer.phone}</p>
                                        <p>💳 ${o.paymentStatus}</p>
                                    </div>

                                    <div class="flex gap-2">
                                        ${o.status === 'Pending' ? `<button onclick="updateStatus('${d.id}', 'Shipped')" class="flex-1 bg-black text-white py-2 rounded-lg text-xs font-bold">Mark Shipped</button>` : ''}
                                        ${o.status === 'Shipped' ? `<button onclick="updateStatus('${d.id}', 'Delivered')" class="flex-1 bg-green-600 text-white py-2 rounded-lg text-xs font-bold">Mark Delivered</button>` : ''}
                                        <a href="tel:${o.customer.phone}" class="px-3 py-2 border border-gray-300 rounded-lg text-gray-600 flex items-center justify-center"><i class="ph ph-phone"></i></a>
                                    </div>
                                </div>`;
                        });
                    }
                    document.getElementById('total-orders').innerText = count;
                    document.getElementById('total-revenue').innerText = "₹" + revenue.toLocaleString();
                });

                // 2. PRODUCTS LISTENER
                onSnapshot(query(collection(db, "products"), orderBy("timestamp", "desc")), (snapshot) => {
                    const list = document.getElementById('products-list');
                    list.innerHTML = "";
                    if(snapshot.empty) list.innerHTML = '<p class="text-center text-gray-400 text-sm">No products added.</p>';
                    
                    snapshot.forEach((d) => {
                        const p = d.data();
                        list.innerHTML += `
                            <div class="flex items-center gap-3 bg-white p-3 rounded-xl border border-gray-200 shadow-sm">
                                <img src="${p.img}" class="w-16 h-16 rounded-lg object-cover bg-gray-100">
                                <div class="flex-1 min-w-0">
                                    <h4 class="font-bold text-sm truncate">${p.name}</h4>
                                    <p class="text-xs text-gray-500">${p.brand}</p>
                                    <p class="text-sm font-bold text-black">₹${p.price}</p>
                                </div>
                                <button onclick="deleteProduct('${d.id}')" class="w-8 h-8 flex items-center justify-center rounded-full bg-red-50 text-red-600 hover:bg-red-100">
                                    <i class="ph ph-trash"></i>
                                </button>
                            </div>`;
                    });
                });

            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('dashboard-screen').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
