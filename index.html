<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Import House | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: sans-serif; background-color: #f3f4f6; }
        .hidden { display: none; }
    </style>
</head>
<body class="text-gray-900">

    <div id="login-screen" class="h-screen flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
            <h1 class="text-2xl font-black mb-2">Admin Panel</h1>
            <p class="text-gray-500 mb-6">Login to view orders</p>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="email" id="email" placeholder="Admin Email" class="w-full p-3 border rounded-lg outline-none" required>
                <input type="password" id="password" placeholder="Password" class="w-full p-3 border rounded-lg outline-none" required>
                <button type="submit" class="w-full bg-black text-white font-bold py-3 rounded-lg">Login</button>
            </form>
        </div>
    </div>

    <div id="dashboard-screen" class="hidden min-h-screen pb-20">
        <header class="bg-black text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
            <h1 class="font-bold text-lg">Orders Feed</h1>
            <button onclick="logout()" class="text-xs bg-red-600 px-3 py-1 rounded">Logout</button>
        </header>

        <div class="grid grid-cols-2 gap-4 p-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <p class="text-gray-500 text-xs uppercase font-bold">Total Orders</p>
                <h2 class="text-3xl font-black" id="total-orders">0</h2>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <p class="text-gray-500 text-xs uppercase font-bold">Revenue</p>
                <h2 class="text-3xl font-black text-green-600" id="total-revenue">₹0</h2>
            </div>
        </div>

        <div id="orders-list" class="px-4 space-y-4">
            <p class="text-center text-gray-400 mt-10">Waiting for orders...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // --- ⚠️ PASTE YOUR SAME FIREBASE KEYS HERE ⚠️ ---
        const firebaseConfig = {
            apiKey: "AIzaSyAVAhzIDoiFiGxHN0z2ze9TSocB3Cbb6i8",
  authDomain: "shop-clothes-aded9.firebaseapp.com",
  projectId: "shop-clothes-aded9",
  storageBucket: "shop-clothes-aded9.firebasestorage.app",
  messagingSenderId: "119802803208",
  appId: "1:119802803208:web:984c947412580274268dbd",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- 1. AUTHENTICATION ---
        window.handleLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) { alert("Login failed: " + error.message); }
        }

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                startOrderListener();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('dashboard-screen').classList.add('hidden');
            }
        });

        // --- 2. REAL-TIME ORDER LISTENER ---
        function startOrderListener() {
            const q = query(collection(db, "orders"), orderBy("timestamp", "desc"));
            
            // This runs every time the database changes instantly
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('orders-list');
                list.innerHTML = ""; // Clear list
                
                let count = 0;
                let revenue = 0;

                if(snapshot.empty) {
                    list.innerHTML = '<p class="text-center text-gray-400 mt-10">No orders found.</p>';
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const order = docSnap.data();
                    const orderId = docSnap.id;
                    count++;
                    revenue += order.totalAmount;

                    // Create Card HTML
                    const card = document.createElement('div');
                    card.className = "bg-white p-5 rounded-2xl shadow-sm border border-gray-200 relative";
                    
                    // Status Color Logic
                    let statusColor = "bg-yellow-100 text-yellow-700";
                    if(order.status === "Shipped") statusColor = "bg-blue-100 text-blue-700";
                    if(order.status === "Delivered") statusColor = "bg-green-100 text-green-700";

                    // Items List
                    let itemsHtml = order.items.map(i => `<div class="text-sm text-gray-600 flex justify-between"><span>${i.name}</span><span>₹${i.price}</span></div>`).join('');

                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="font-bold text-lg">${order.customer.firstName} ${order.customer.lastName}</h3>
                                <p class="text-xs text-gray-400">ID: ${orderId.slice(0,6)}</p>
                            </div>
                            <span class="px-2 py-1 rounded text-xs font-bold ${statusColor}">${order.status}</span>
                        </div>
                        
                        <div class="border-t border-b border-gray-100 py-3 my-3 space-y-1">
                            ${itemsHtml}
                        </div>
                        
                        <div class="flex justify-between font-bold text-lg mb-3">
                            <span>Total</span>
                            <span>₹${order.totalAmount.toLocaleString()}</span>
                        </div>

                        <div class="bg-gray-50 p-3 rounded-lg text-sm text-gray-600 mb-4">
                            <p class="font-bold mb-1">📍 Delivery Address:</p>
                            ${order.customer.address}, ${order.customer.city} - ${order.customer.zip}<br>
                            📞 ${order.customer.phone}
                        </div>

                        <div class="flex gap-2">
                            ${order.status === 'Pending' ? `<button onclick="updateStatus('${orderId}', 'Shipped')" class="flex-1 bg-black text-white py-2 rounded-lg text-sm font-bold">Mark Shipped</button>` : ''}
                            ${order.status === 'Shipped' ? `<button onclick="updateStatus('${orderId}', 'Delivered')" class="flex-1 bg-green-600 text-white py-2 rounded-lg text-sm font-bold">Mark Delivered</button>` : ''}
                            <a href="tel:${order.customer.phone}" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-600"><i class="ph ph-phone"></i></a>
                        </div>
                    `;
                    list.appendChild(card);
                });

                document.getElementById('total-orders').innerText = count;
                document.getElementById('total-revenue').innerText = "₹" + revenue.toLocaleString();
            });
        }

        // --- 3. UPDATE ORDER STATUS ---
        window.updateStatus = async (id, newStatus) => {
            const orderRef = doc(db, "orders", id);
            await updateDoc(orderRef, { status: newStatus });
        }
    </script>
</body>

</html>
